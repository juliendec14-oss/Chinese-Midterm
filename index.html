ck": "横 héng = 一<br>竖 shù = 丨<br>撇 piě = 丿<br>捺 nà = ㇏<br>点 diǎn = 丶", "category": "Divers"}, {"front": "Différence 人 / 入 / 八 ?", "back": "人 rén : 捺 part au-dessus de 撇<br>入 rù : 捺 traverse 撇<br>八 bā : les deux traits restent séparés", "category": "Vocabulaire"}, {"front": "Comment retenir 太 ?", "back": "太 tài = 大 dà + un point", "category": "Vocabulaire"}, {"front": "Que contient 天 ?", "back": "一、二、人、大、天", "category": "Vocabulaire"}, {"front": "八 + 刀 donne quel caractère ?", "back": "分 fēn = diviser", "category": "Vocabulaire"}, {"front": "Que signifie 入木三分 ?", "back": "Littéralement « entrer dans le bois de trois fēn ».<br>Idée : écriture puissante ; aujourd'hui, analyse très profonde.", "category": "Vocabulaire"}, {"front": "偏旁 亻 est associé à quoi ?", "back": "À 人 : personnes / humains.<br>Ex. 你、他、住、做", "category": "Vocabulaire"}, {"front": "偏旁 女 est associé à quoi ?", "back": "Au féminin / aux femmes.<br>Ex. 她、妈、姐妹", "category": "Vocabulaire"}, {"front": "偏旁 口 est associé à quoi ?", "back": "À la bouche / parler.<br>Ex. 叫、名、喊", "category": "Vocabulaire"}, {"front": "偏旁 辶 est associé à quoi ?", "back": "À marcher / déplacement / distance.<br>Ex. 远、近、这、这里", "category": "Vocabulaire"}, {"front": "Structure de base d'une phrase chinoise ?", "back": "Sujet + Verbe + Objet (SVO)", "category": "Divers"}, {"front": "Comment dire « Je m'appelle… » ?", "back": "我叫……<br>Wǒ jiào……", "category": "Divers"}, {"front": "Comment dire « Je suis Chinois(e) » ?", "back": "我是中国人。<br>Wǒ shì Zhōngguórén.", "category": "Divers"}, {"front": "Comment demander « Comment tu t'appelles ? » ?", "back": "你叫什么名字？<br>Nǐ jiào shénme míngzi?", "category": "Grammaire"}, {"front": "什么 shénme vs 哪 nǎ ?", "back": "什么 = « quoi/quel » : réponse ouverte.<br>哪 = « lequel/quelle » : choix dans un ensemble.", "category": "Grammaire"}, {"front": "Comment utiliser 呢 ne ?", "back": "Personne + 呢？ = « et toi/lui/elle ? »<br>我叫Chloe。你呢？", "category": "Grammaire"}, {"front": "Structure avec 的 ?", "back": "Posse let deck=[],current=null,mode='all',seen=0,correct=0,wrong=0,testLeft=0,testMode=false;
const hard=new Map();
const ids=['home','categories','study','stats'];
function screen(id){ids.forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));}
function start(m,cat=null){
 mode=m;testMode=false;
 deck=cards.filter(c=>!cat||c.category===cat).slice().sort(()=>Math.random()-.5);
 if(m==='hard')deck=deck.filter(c=>(hard.get(c.front)||0)>0);
 if(!deck.length){alert("Aucune carte difficile pour l'instant 😭");return;}
 document.getElementById('modeLabel').textContent=cat?cat:(m==='hard'?'Difficiles':'Révision');
 screen('study');next();
}
function next(){
 if(!deck.length)deck=cards.slice().sort(()=>Math.random()-.5);
 current=deck.shift();
 document.getElementById('cat').textContent=current.category;
 document.getElementById('front').textContent=current.front;
 document.getElementById('back').textContent=current.back;
 document.getElementById('back').classList.add('hidden');
 document.getElementById('reveal').classList.remove('hidden');
 document.getElementById('actions').classList.add('hidden');
 document.getElementById('bar').style.width=Math.min(100,(seen/Math.max(cards.length,1))*100)+'%';
}
function reveal(){
 seen++;
 document.getElementById('back').classList.remove('hidden');
 document.getElementById('reveal').classList.add('hidden');
 document.getElementById('actions').classList.remove('hidden');
 update();
}
function grade(ok){
 if(testMode){
   if(ok)correct++;else wrong++;
   if(testLeft<=0){alert('Test terminé ! Score : '+correct+' / 10');screen('home');return;}
   nextTest();update();return;
 }
 if(ok){correct++;hard.delete(current.front)}else{wrong++;hard.set(current.front,(hard.get(current.front)||0)+1);deck.push(current);deck.push(current);}
 update();next();
}
function startTest(){
 testMode=true;mode='test';correct=0;wrong=0;seen=0;testLeft=10;
 deck=cards.slice().sort(()=>Math.random()-.5);
 document.getElementById('modeLabel').textContent='TEST · 10 cartes';
 screen('study');nextTest();
}
function nextTest(){
 if(testLeft<=0){alert('Test terminé ! Score : '+correct+' / 10');screen('home');return;}
 current=deck.shift();testLeft--;
 document.getElementById('cat').textContent='TEST · '+(10-testLeft)+'/10';
 document.getElementById('front').textContent=current.front;
 document.getElementById('back').textContent=current.back;
 document.getElementById('back').classList.add('hidden');
 document.getElementById('reveal').classList.remove('hidden');
 document.getElementById('actions').classList.add('hidden');
}
function update(){document.getElementById('seen').textContent=seen;document.getElementById('correct').textContent=correct;document.getElementById('wrong').textContent=wrong;}
function resetAll(){seen=correct=wrong=0;hard.clear();update();screen('home')}
const cats=[...new Set(cards.map(c=>c.category))];
document.getElementById('catList').innerHTML=cats.map(c=>'<button onclick="start(\\'all\\',\\''+c.replace(/'/g,"\\\\'")+'\\')">📖 '+c+'<br><span class="muted">'+cards.filter(x=>x.category===c).length+' cartes</span></button>').join('');
update();
</script>
